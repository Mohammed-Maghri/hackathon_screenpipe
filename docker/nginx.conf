server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /preview-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Expose the API/docs on the same local origin for inspection.
    # This does not replace Electron's native IPC bridge.
    location ~ ^/(api(?:/|$)|health$|docs(?:/|$)) {
        set $ghost_backend backend:3001;
        proxy_pass http://$ghost_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;
        client_max_body_size 1m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
