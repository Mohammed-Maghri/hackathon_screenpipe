services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ghost
      POSTGRES_PASSWORD: ghost_dev
      POSTGRES_DB: ghost
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ghost_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ghost -d ghost"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  ghost_postgres:
